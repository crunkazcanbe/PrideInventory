buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
apply plugin: 'net.minecraftforge.gradle'

version = '0.2.0'
group = 'com.dogpound.prideinventory'
archivesBaseName = 'PrideInventory-1.12.2'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly files('libs/emi.jar')
    compileOnly files('libs/mixinbooter-api.jar')
    compileOnly files('libs/sponge-mixin.jar')
    compileOnly files('libs/realmcoin-dev.jar')   // optional: buy rows with coins
}

jar {
    exclude 'zone/**'
    manifest {
        attributes([
            'FMLCorePlugin'               : 'com.dogpound.prideinventory.PrideInventoryCore',
            'FMLCorePluginContainsFMLMod' : 'true',
            'ForceLoadAsMod'              : 'true',
            'MixinConfigs'                : 'prideinventory.mixins.json'
        ])
    }
}
jar.finalizedBy('reobfJar')
